services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trippilot
      POSTGRES_PASSWORD: trippilot
      POSTGRES_DB: trippilot
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippilot"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://trippilot:trippilot@db:5432/trippilot
      TEST_DATABASE_URL: postgres://trippilot:trippilot@db:5432/trippilot_test
      JWT_SECRET: dev-secret-change-me
      PORT: "4000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

volumes:
  db-data:
